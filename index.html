<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nelson Mendoza 100643232</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        
        :root {
            --tw-color-primary: #3b82f6;
        }
        
        .tail-container * {
            font-family: 'Inter', system_ui, sans-serif;
        }
        
        /* Menú principal */
        #dynamic-menu ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        /* Dropdown desktop */
        .menu-item {
            position: relative;
        }
        
        .menu-item:hover > .submenu {
            display: block;
        }
        
        .submenu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background-color: white;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            border-radius: 8px;
            min-width: 220px;
            z-index: 50;
            padding: 8px 0;
        }
        
        .submenu li a {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            color: #1f2937;
            text-decoration: none;
            transition: all 0.2s;
        }
        
        .submenu li a:hover {
            background-color: #f1f5f9;
            padding-left: 28px;
        }
        
        /* Mobile menu */
        .mobile-menu {
            animation: slideDown 0.3s ease forwards;
        }
        
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Tree view en panel de administración */
        .tree-item {
            transition: all 0.2s;
        }
    </style>
</head>
<body class="tail-container bg-slate-50 min-h-screen">
    <div class="max-w-7xl mx-auto">
        <!-- HEADER -->
        <div class="bg-white border-b shadow-sm">
            <div class="px-8 py-6 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-blue-600 rounded-2xl flex items-center justify-center text-white text-2xl">📋</div>
                    <h1 class="text-3xl font-semibold text-slate-900">Menú Dinámico Multinivel</h1>
                </div>
                <div class="flex items-center gap-4">
                    <div onclick="toggleTheme()" class="cursor-pointer text-slate-500 hover:text-slate-700 transition-colors">
                        <span id="theme-icon" class="text-2xl">☀️</span>
                    </div>
                    <a href="https://github.com" target="_blank" 
                       class="flex items-center gap-2 px-5 py-2.5 bg-slate-900 text-white text-sm font-medium rounded-3xl hover:bg-slate-800 transition-all">
                        <span>Ver en GitHub</span>
                        <span class="text-lg">→</span>
                    </a>
                </div>
            </div>
            
            <!-- EL MENÚ DINÁMICO (se genera completamente desde JSON) -->
            <nav id="dynamic-menu" class="px-8 bg-white border-t">
                <!-- Se rellena con JavaScript -->
            </nav>
        </div>

        <div class="p-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
            
                
            <!-- PANEL DE ADMINISTRACIÓN -->
            <div class="lg:col-span-5 space-y-6">
                
                <!-- EDITOR JSON -->
                <div class="bg-white rounded-3xl shadow-sm border p-6">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="font-semibold text-lg">📄 Estructura JSON (editable)</h3>
                        <button onclick="resetToDefault()" 
                                class="text-xs px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-2xl text-slate-700 flex items-center gap-1 transition-colors">
                            🔄 Restaurar ejemplo
                        </button>
                    </div>
                    <textarea id="json-editor" rows="12"
                        class="w-full font-mono text-xs bg-slate-900 text-emerald-300 p-5 rounded-3xl border border-slate-700 focus:outline-none focus:border-blue-500 resize-y"></textarea>
                    <div class="flex gap-3 mt-4">
                        <button onclick="updateFromJsonEditor()" 
                                class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-3.5 rounded-3xl transition-all">
                            ✅ Aplicar cambios al menú
                        </button>
                    </div>
                    <p class="text-[10px] text-slate-400 mt-2 text-center">Cualquier modificación aquí se refleja al instante</p>
                </div>
                
                <!-- FORMULARIO AGREGAR -->
                <div class="bg-white rounded-3xl shadow-sm border p-6">
                    <h3 class="font-semibold text-lg mb-4">➕ Agregar nueva opción</h3>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div class="col-span-2">
                            <label class="block text-xs font-medium text-slate-500 mb-1">Nombre de la opción</label>
                            <input id="add-nombre" type="text" placeholder="Ej: Blog"
                                   class="w-full px-5 py-4 rounded-3xl border border-slate-200 focus:border-blue-300 outline-none text-slate-700">
                        </div>
                        
                        <div>
                            <label class="block text-xs font-medium text-slate-500 mb-1">Enlace</label>
                            <input id="add-enlace" type="text" placeholder="/blog o https://..."
                                   class="w-full px-5 py-4 rounded-3xl border border-slate-200 focus:border-blue-300 outline-none text-slate-700">
                        </div>
                        
                        <div>
                            <label class="block text-xs font-medium text-slate-500 mb-1">Ícono (emoji opcional)</label>
                            <input id="add-icono" type="text" maxlength="2" placeholder="📝" value="📝"
                                   class="w-full px-5 py-4 rounded-3xl border border-slate-200 focus:border-blue-300 outline-none text-slate-700 text-center">
                        </div>
                        
                        <div class="col-span-2">
                            <label class="block text-xs font-medium text-slate-500 mb-1">¿Dónde agregar?</label>
                            <select id="add-parent" class="w-full px-5 py-4 rounded-3xl border border-slate-200 focus:border-blue-300 outline-none text-slate-700">
                                <!-- Se llena dinámicamente por JS -->
                            </select>
                        </div>
                    </div>
                    
                    <button onclick="addNewItem()"
                            class="mt-6 w-full bg-emerald-600 hover:bg-emerald-700 text-white py-4 rounded-3xl font-semibold flex items-center justify-center gap-2 transition-all">
                        <span class="text-xl">＋</span>
                        AGREGAR AL MENÚ
                    </button>
                </div>
                
                <!-- ELIMINAR POR ID -->
                <div class="bg-white rounded-3xl shadow-sm border p-6 flex gap-3 items-end">
                    <div class="flex-1">
                        <label class="block text-xs font-medium text-slate-500 mb-1">Eliminar por ID</label>
                        <input id="delete-id" type="number" placeholder="Ej: 7"
                               class="w-full px-5 py-4 rounded-3xl border border-slate-200 focus:border-red-300 outline-none text-slate-700">
                    </div>
                    <button onclick="deleteById()" 
                            class="px-8 py-4 bg-red-600 hover:bg-red-700 text-white font-medium rounded-3xl transition-all">
                        🗑 Eliminar
                    </button>
                </div>
                
                <!-- Información -->
                <div class="text-xs text-slate-400 flex justify-between items-center px-2">
                    <div>✅ Nelson Arjuna Mendoza 100643232</div>
                    <div onclick="showRequirements()" class="cursor-pointer underline">Ver requerimientos cumplidos →</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        //DATOS JSON INICIAL (multinivel)
        let menuData = {
            menu: [
                {
                    id: 1,
                    nombre: "Inicio",
                    enlace: "#inicio",
                    icono: "🏠",
                    subitems: []
                },
                {
                    id: 2,
                    nombre: "Servicios",
                    enlace: "#servicios",
                    icono: "🛠️",
                    subitems: [
                        {
                            id: 5,
                            nombre: "Desarrollo Web",
                            enlace: "#web",
                            icono: "💻",
                            subitems: [
                                { id: 8, nombre: "Sitios E-commerce", enlace: "#ecommerce", icono: "🛒" },
                                { id: 9, nombre: "Landing Pages", enlace: "#landing", icono: "📄" }
                            ]
                        },
                        {
                            id: 6,
                            nombre: "Marketing Digital",
                            enlace: "#marketing",
                            icono: "📣",
                            subitems: []
                        },
                        {
                            id: 7,
                            nombre: "Consultoría",
                            enlace: "#consultoria",
                            icono: "📊",
                            subitems: []
                        }
                    ]
                },
                {
                    id: 3,
                    nombre: "Sobre Nosotros",
                    enlace: "#sobre-nosotros",
                    icono: "👥",
                    subitems: []
                },
                {
                    id: 4,
                    nombre: "Contacto",
                    enlace: "#contacto",
                    icono: "✉️",
                    subitems: []
                }
            ]
        }

        //FUNCIONES AUXILIARES
        function getNextId() {
            let max = 0
            function scan(items) {
                items.forEach(item => {
                    if (item.id > max) max = item.id
                    if (item.subitems && item.subitems.length) scan(item.subitems)
                })
            }
            scan(menuData.menu)
            return max + 1
        }

        function findItem(items, id) {
            for (let item of items) {
                if (item.id === id) return item
                if (item.subitems && item.subitems.length) {
                    const found = findItem(item.subitems, id)
                    if (found) return found
                }
            }
            return null
        }

        function removeItem(items, id) {
            for (let i = 0; i < items.length; i++) {
                if (items[i].id === id) {
                    items.splice(i, 1)
                    return true
                }
                if (items[i].subitems && items[i].subitems.length) {
                    if (removeItem(items[i].subitems, id)) return true
                }
            }
            return false
        }

        function getParentOptions(items = menuData.menu, prefix = '') {
            let options = []
            items.forEach(item => {
                const label = prefix ? `${prefix} › ${item.nombre}` : item.nombre
                options.push({ id: item.id, label: label })
                if (item.subitems && item.subitems.length) {
                    options = options.concat(getParentOptions(item.subitems, label))
                }
            })
            return options
        }

        function populateParentSelect() {
            const select = document.getElementById('add-parent')
            select.innerHTML = `<option value="0">Nivel principal (raíz)</option>`
            
            const options = getParentOptions()
            options.forEach(opt => {
                const optionEl = document.createElement('option')
                optionEl.value = opt.id
                optionEl.textContent = `↳ ${opt.label}`
                select.appendChild(optionEl)
            })
        }

        //RENDERIZADO DEL MENÚ
        function renderMenu() {
            const container = document.getElementById('dynamic-menu')
            container.innerHTML = `
                <div class="max-w-screen-2xl mx-auto flex items-center justify-between py-4">
                    <!-- Desktop Menu -->
                    <ul class="hidden md:flex items-center gap-8 text-base font-medium text-slate-700">
                        ${menuData.menu.map(item => createMenuItemHTML(item)).join('')}
                    </ul>
                    
                    <!-- Mobile Hamburger -->
                    <button onclick="toggleMobileMenu()" id="hamburger-btn"
                            class="md:hidden w-11 h-11 flex items-center justify-center text-3xl border border-slate-200 rounded-2xl hover:bg-slate-100">
                        ☰
                    </button>
                    
                    <!-- Logo / Título pequeño -->
                    <div class="md:hidden flex-1 text-center text-lg font-semibold text-slate-900">Menú Dinámico</div>
                    
                    <!-- Mobile Menu Container -->
                    <div id="mobile-menu" class="hidden md:hidden fixed inset-0 bg-white z-50 pt-20 px-6 overflow-auto mobile-menu">
                        <div class="flex justify-end mb-6">
                            <button onclick="toggleMobileMenu()" class="text-4xl text-slate-400">✕</button>
                        </div>
                        <ul class="space-y-2 text-lg">
                            ${menuData.menu.map(item => createMobileMenuItemHTML(item)).join('')}
                        </ul>
                    </div>
                </div>
            `
        }

        function createMenuItemHTML(item) {
            let html = `
                <li class="menu-item group">
                    <a href="${item.enlace}" 
                       onclick="handleClick(event, '${item.enlace}')"
                       class="flex items-center gap-2 px-6 py-3 rounded-3xl hover:bg-slate-100 transition-colors">
                        <span class="text-xl">${item.icono || ''}</span>
                        <span>${item.nombre}</span>
                        ${item.subitems && item.subitems.length ? `<span class="text-xs ml-1 transition-transform group-hover:rotate-180">▼</span>` : ''}
                    </a>
            `
            if (item.subitems && item.subitems.length) {
                html += `
                    <ul class="submenu py-2 shadow-xl">
                        ${item.subitems.map(sub => createSubItemHTML(sub)).join('')}
                    </ul>
                `
            }
            html += `</li>`
            return html
        }

        function createSubItemHTML(item) {
            let html = `
                <li>
                    <a href="${item.enlace}" onclick="handleClick(event, '${item.enlace}')" class="flex items-center gap-3">
                        <span class="text-xl">${item.icono || ''}</span>
                        <span class="font-medium">${item.nombre}</span>
                    </a>
            `
            if (item.subitems && item.subitems.length) {
                html += `<ul class="pl-8 mt-1 border-l border-slate-200">`
                item.subitems.forEach(sub => {
                    html += createSubItemHTML(sub)
                })
                html += `</ul>`
            }
            html += `</li>`
            return html
        }

        function createMobileMenuItemHTML(item) {
            let html = `
                <li class="border-b border-slate-100">
                    <a href="${item.enlace}" onclick="handleClick(event, '${item.enlace}'); toggleMobileMenu()" 
                       class="flex items-center justify-between py-4 px-4">
                        <span class="flex items-center gap-3">
                            <span class="text-2xl">${item.icono || ''}</span>
                            ${item.nombre}
                        </span>
            `
            if (item.subitems && item.subitems.length) {
                html += `<span class="text-xs bg-slate-200 text-slate-600 px-3 py-1 rounded-3xl">+${item.subitems.length}</span>`
                html += `</a><div class="pl-10 pb-3">`
                item.subitems.forEach(sub => {
                    html += createMobileSubItemHTML(sub)
                })
                html += `</div>`
            } else {
                html += `</a>`
            }
            html += `</li>`
            return html
        }

        function createMobileSubItemHTML(item) {
            return `
                <a href="${item.enlace}" onclick="handleClick(event, '${item.enlace}'); toggleMobileMenu()" 
                   class="flex items-center gap-3 py-3 px-4 text-base text-slate-600 hover:text-blue-600">
                    <span class="text-xl">${item.icono || ''}</span>
                    ${item.nombre}
                </a>
                ${item.subitems && item.subitems.length ? `<div class="pl-8">${item.subitems.map(createMobileSubItemHTML).join('')}</div>` : ''}
            `
        }

        function handleClick(e, enlace) {
            // Alerts navegación
            if (enlace.startsWith('#')) {
                e.preventDefault()
                const msg = `🚀 Navegando a: ${enlace}\n\n(Aquí simulamos la navegación, maestro.)`
                console.log('%c' + msg, 'background:#3b82f6;color:white;padding:4px 8px;border-radius:4px')
                alert(msg)
            }
        }

        function toggleMobileMenu() {
            const mobile = document.getElementById('mobile-menu')
            const btn = document.getElementById('hamburger-btn')
            if (mobile.classList.contains('hidden')) {
                mobile.style.display = 'block'
                btn.innerHTML = '✕'
            } else {
                mobile.style.display = 'none'
                btn.innerHTML = '☰'
            }
        }

        //FUNCIONES DE GESTIÓN
        function updateEditor() {
            document.getElementById('json-editor').value = JSON.stringify(menuData, null, 2)
        }

        function updateFromJsonEditor() {
            const textarea = document.getElementById('json-editor')
            try {
                const parsed = JSON.parse(textarea.value)
                if (!parsed.menu || !Array.isArray(parsed.menu)) {
                    throw new Error('El JSON debe tener la clave "menu" con un array')
                }
                menuData = parsed
                renderMenu()
                populateParentSelect()
                updateEditor()
                showToast('✅ Menú actualizado desde JSON')
            } catch (err) {
                alert('❌ JSON inválido:\n' + err.message)
            }
        }

        function addNewItem() {
            const nombre = document.getElementById('add-nombre').value.trim()
            const enlace = document.getElementById('add-enlace').value.trim()
            const icono = document.getElementById('add-icono').value.trim()
            const parentId = parseInt(document.getElementById('add-parent').value)

            if (!nombre || !enlace) {
                alert('⚠️ Nombre y enlace son obligatorios')
                return
            }

            // Validación simple de enlace
            if (!enlace.startsWith('/') && !enlace.startsWith('http') && !enlace.startsWith('#')) {
                if (!confirm('El enlace no comienza con /, http o #. ¿Continuar?')) return
            }

            const newItem = {
                id: getNextId(),
                nombre: nombre,
                enlace: enlace,
                icono: icono || '🔗',
                subitems: []
            }

            if (parentId === 0) {
                // Nivel principal
                menuData.menu.push(newItem)
            } else {
                const parent = findItem(menuData.menu, parentId)
                if (parent) {
                    if (!parent.subitems) parent.subitems = []
                    parent.subitems.push(newItem)
                } else {
                    alert('❌ No se encontró el elemento padre')
                    return
                }
            }

            // Limpiar formulario
            document.getElementById('add-nombre').value = ''
            document.getElementById('add-enlace').value = ''

            // Actualizar todo
            renderMenu()
            populateParentSelect()
            updateEditor()
            showToast(`✅ "${nombre}" agregado correctamente`)
        }

        function deleteById() {
            const idInput = document.getElementById('delete-id')
            const id = parseInt(idInput.value)
            
            if (!id) {
                alert('Ingresa un ID válido')
                return
            }
            
            if (confirm(`¿Eliminar permanentemente el elemento con ID ${id}?`)) {
                const removed = removeItem(menuData.menu, id)
                if (removed) {
                    renderMenu()
                    populateParentSelect()
                    updateEditor()
                    idInput.value = ''
                    showToast(`🗑️ Elemento ID ${id} eliminado`)
                } else {
                    alert('ID no encontrado')
                }
            }
        }

        function resetToDefault() {
            if (confirm('¿Restaurar el JSON de ejemplo original?')) {
                menuData = {
                    menu: [
                        { id: 1, nombre: "Inicio", enlace: "#inicio", icono: "🏠", subitems: [] },
                        { id: 2, nombre: "Servicios", enlace: "#servicios", icono: "🛠️", subitems: [
                            { id: 5, nombre: "Desarrollo Web", enlace: "#web", icono: "💻", subitems: [
                                { id: 8, nombre: "Sitios E-commerce", enlace: "#ecommerce", icono: "🛒" },
                                { id: 9, nombre: "Landing Pages", enlace: "#landing", icono: "📄" }
                            ]},
                            { id: 6, nombre: "Marketing Digital", enlace: "#marketing", icono: "📣", subitems: [] },
                            { id: 7, nombre: "Consultoría", enlace: "#consultoria", icono: "📊", subitems: [] }
                        ]},
                        { id: 3, nombre: "Sobre Nosotros", enlace: "#sobre-nosotros", icono: "👥", subitems: [] },
                        { id: 4, nombre: "Contacto", enlace: "#contacto", icono: "✉️", subitems: [] }
                    ]
                }
                renderMenu()
                populateParentSelect()
                updateEditor()
                showToast('🔄 JSON restaurado')
            }
        }

        function showToast(message) {
            const toast = document.createElement('div')
            toast.style.cssText = 'position:fixed; bottom:20px; right:20px; background:#10b981; color:white; padding:16px 24px; border-radius:9999px; box-shadow:0 10px 15px -3px rgb(0 0 0 / 0.2); z-index:9999; animation: toastIn 0.3s'
            toast.innerHTML = message
            document.body.appendChild(toast)
            setTimeout(() => {
                toast.style.animation = 'toastOut 0.3s forwards'
                setTimeout(() => toast.remove(), 300)
            }, 2800)
        }

        function toggleTheme() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark')
                document.getElementById('theme-icon').textContent = '☀️'
            } else {
                document.documentElement.classList.add('dark')
                document.getElementById('theme-icon').textContent = '🌙'
            }
        }

        function showRequirements() {
            const msg = `✅ REQUERIMIENTOS CUMPLIDOS DEL DOCUMENTO:\n\n` +
                        `• Estructura JSON multinivel (subitems)\n` +
                        `• Renderizado dinámico 100% desde datos\n` +
                        `• Agregar vía formulario + editor JSON\n` +
                        `• Eliminar por ID o editando JSON\n` +
                        `• Actualización sin recargar página\n` +
                        `• ID único automático\n` +
                        `• Validación básica de enlaces\n` +
                        `• Responsive (desktop + móvil)\n` +
                        `• Iconos incluidos\n` +
                        `• Modular y mantenible\n` +
                        `• Seguridad (frontend)\n\n` +
                        `Maestro Silverio Gonzales, este menú es sencillo, pero cumple.`
            alert(msg)
        }

        //INICIALIZACIÓN
        window.onload = function() {
            renderMenu()
            populateParentSelect()
            updateEditor()
            
            console.log('%c✅ Menú Dinámico Multinivel cargado correctamente', 'color:#3b82f6; font-size:13px; font-weight:600')
            console.log('JSON inicial disponible en la variable global "menuData"')
        }
    </script>
</body>
</html>
